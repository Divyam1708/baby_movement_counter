<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <a href="{% url 'movement:home'%}">
        <button>
            HOME
        </button>
    </a>


    <form action="" method="post">
        {% csrf_token %}
        {% for field in form %}
            {{ field.label_tag }} : {{ field }}
        {% endfor %}
        <button type="submit">Go to Date</button>
    </form>

    For : {{ date }}
    
    <ol type="1">
    {% for movement in movements %}
        <li>
            {{ movement.time|time|title }}
            <a href="{% url 'movement:delete-movement' movement.id %}">
                <button>DELETE</button>
            </a>
        </li>    
    {% endfor %}
    </ol>

</body>
</html>
