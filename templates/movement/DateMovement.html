<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movement on {{ date }}</title>
    <link rel="shortcut icon" href="{% static 'media/logos/counter_icon.png' %}" type="image/x-icon">
    <link rel="stylesheet" href="{% static 'style/movement/base.css' %}">
</head>
<body>

    <div class="top_bar" > 
        <a href="{% url 'movement:home'%}">
            <button class="click_me">
                HOME
            </button>
        </a>
        
        
        <form action="" method="post">
            {% csrf_token %}
            {% for field in form %}
            {{ field.label_tag }} : {{ field }}
            {% endfor %}
            <button class="click_me" type="submit">Go to Date</button>
        </form>
    </div>

    <div class="counter_content">
        <a href="{% url 'movement:month-wise-per-day-counter' month %}">
            <button class="click_me">CLICK TO SEE DAY WISE MOVEMENT FOR THIS MONTH</button>
        </a>
        <p class="headline">
            {{ date }} => {{ movement_count }}
        </p>
        
        <ol type="1">
            {% for movement in movements %}
            <li>
                <div class="time_box">
                    {{ movement.time|time:"h : i A" }}
                </div>
                <a href="{% url 'movement:delete-movement' movement.id %}">
                    <button class="click_me_delete">DELETE</button>
                </a>
            </li>    
            {% endfor %}
        </ol>
    </div>

</body>
</html>
